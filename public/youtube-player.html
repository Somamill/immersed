<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Immersed player</title>
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;background:#000;overflow:hidden}iframe{display:block}</style>
</head>
<body>
  <script>
    const id = new URL(location.href).searchParams.get('v');
    if (/^[A-Za-z0-9_-]{11}$/.test(id || '')) {
      const frame = document.createElement('iframe');
      const query = new URLSearchParams({playsinline:'1',controls:'1',cc_load_policy:'1',cc_lang_pref:'ja',hl:'ja',enablejsapi:'1',origin:location.origin});
      frame.src = 'https://www.youtube.com/embed/' + id + '?' + query;
      frame.referrerPolicy = 'strict-origin-when-cross-origin';
      frame.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
      frame.allowFullscreen = true;
      frame.title = 'YouTube video';
      document.body.appendChild(frame);
    }
  </script>
</body>
</html>
