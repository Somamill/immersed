name: App bug or layout issue
description: Report an issue with playback, navigation, search or layout.
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include a screenshot if useful.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version, iPhone model and iOS version
