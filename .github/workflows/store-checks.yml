name: Store edition checks
on:
  pull_request:
    paths: ['Apps/Store/**', 'branding/dot/**', '.github/workflows/store-checks.yml']
  push:
    branches: [main]
    paths: ['Apps/Store/**', 'branding/dot/**', '.github/workflows/store-checks.yml']
permissions:
  contents: read
jobs:
  store:
    runs-on: ubuntu-latest
    env:
      EXPO_OFFLINE: '1'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: Apps/Store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Apps/Store/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run dictionary:build
      - run: npm run test:dictionary
      - run: npx expo export --platform ios
