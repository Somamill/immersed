name: Check draft
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - name: Install audio test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run test:server
      - name: Check Mac subtitle and media logic
        run: node --test tests/focused-speech.test.cjs tests/video-priority.test.cjs tests/word-history.test.cjs tests/search.test.cjs tests/transcript-windows.test.cjs tests/transcript-compare.test.cjs tests/mac-media.test.cjs tests/mac-server.test.cjs tests/highlighting.test.cjs tests/caption-frames.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements.txt
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run language:setup
      - run: npm run context:setup
      - run: npm run test:language
      - run: node --test tests/context-meaning.test.cjs tests/screen-captions.test.cjs
      - run: npm run build:hosted
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
