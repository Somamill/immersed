<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Immersed for Mac</title>
<style>
:root{color-scheme:dark;font:16px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#050706;color:#f5f8f6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 82% -15%,#23453655,transparent 35%),#050706}button,input,select{font:inherit}button{cursor:pointer}header{height:82px;padding:17px max(24px,3vw);display:flex;align-items:center;gap:16px;border-bottom:1px solid #24312a;background:#080e0bba;backdrop-filter:blur(22px)}.brand{display:flex;align-items:center;gap:10px;min-width:230px}.brand img{width:39px;height:39px;border-radius:11px}.brand strong{font-size:27px;letter-spacing:-1.5px}.brand small{display:block;color:#94a99c;font-size:11px;letter-spacing:1.3px;text-transform:uppercase}form{display:flex;flex:1;max-width:690px;gap:8px}input{width:100%;background:#152019;color:#f5f8f6;border:1px solid #314638;border-radius:15px;padding:13px 16px;outline:none}input:focus{border-color:#a9d9bb;box-shadow:0 0 0 3px #a9d9bb1b}.primary{background:#b6e3c4;color:#11281b;border:0;border-radius:14px;padding:11px 18px;font-weight:750}.muted{background:#18231d;color:#d4e0d8;border:1px solid #2b3c32;border-radius:13px;padding:10px 14px}.settings{margin-left:auto;display:flex;align-items:center;gap:8px;color:#a8bbae}.settings select{background:#17231c;color:#d9eadf;border:1px solid #314638;border-radius:10px;padding:8px}main{display:grid;grid-template-columns:minmax(430px,1.5fr) minmax(340px,1fr);gap:22px;padding:22px max(24px,3vw);max-width:1800px;margin:auto;height:calc(100vh - 82px)}.videoCard,.studyCard{border:1px solid #25392b;background:#0c120e;border-radius:25px;overflow:hidden;min-height:0}.videoCard{display:flex;flex-direction:column}.video{position:relative;background:#000;flex:1;min-height:300px;display:grid;place-items:center}.video #player,.video iframe{width:100%;height:100%}.placeholder{text-align:center;color:#b4c7b9;max-width:390px;padding:20px}.placeholder b{display:block;color:#eaf5ed;font-size:30px;letter-spacing:-1px;margin-bottom:8px}.videoFooter{padding:16px 20px;border-top:1px solid #26362a;display:flex;align-items:center;gap:12px;min-height:66px}.badge{border-radius:99px;background:#1c3325;color:#b5e2c4;font-size:12px;padding:8px 12px}.videoFooter span:nth-child(2){color:#9fb1a3;font-size:13px}.studyCard{display:flex;flex-direction:column}.studyHead{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #24352a}.studyHead strong{font-size:18px}.studyHead small{color:#9aafa0}.subtitles{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;padding:24px;overflow:auto;text-align:center}.line{font-size:clamp(26px,2.3vw,43px);line-height:1.6;letter-spacing:.015em;font-weight:530;max-width:100%;overflow-wrap:anywhere}.word{background:none;border:0;color:#f4f6f3;padding:1px 2px;border-radius:5px}.word:hover,.word:focus{background:#2d5038;color:#c5f0d1}.unknown{border-bottom:2px solid #9ecba9}.hint{font-size:14px;color:#879b8d}.controls{display:flex;align-items:center;justify-content:center;gap:16px;padding:20px}.control{width:56px;height:50px;border-radius:17px;background:#19261e;border:1px solid #344b3a;color:#d0e5d5;font-size:23px}.control.play{background:#b6e3c4;color:#11281b;width:64px;height:57px}.lookup{border-top:1px solid #274030;padding:20px 25px;min-height:190px;display:none}.lookup.show{display:block}.lookupTop{display:flex;justify-content:space-between;align-items:center}.lookupWord{font-size:31px;font-weight:700}.reading{color:#aecab7;font-size:15px}.definitions{color:#ebf1eb;line-height:1.65;margin-top:14px;max-height:140px;overflow:auto}.smallButton{background:none;border:0;color:#a8c9b1;padding:5px 10px}.error{color:#e7bcae}.spinner{display:inline-block;width:13px;height:13px;border:2px solid #44604d;border-top-color:#b6e3c4;border-radius:50%;animation:spin .8s linear infinite;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){main{grid-template-columns:1fr;height:auto}.videoCard{height:55vh}.studyCard{min-height:55vh}header{height:auto;flex-wrap:wrap}.brand{min-width:0}form{order:3;max-width:none;flex-basis:100%}}
</style>
<header><div class="brand"><img src="/icon.png" alt=""><div><strong>immersed.</strong><small>Japanese on your Mac</small></div></div><form id="search"><input id="query" placeholder="Paste a YouTube link, or search Japanese videos" aria-label="Video URL or search"><button class="primary">Watch</button></form><div class="settings"><span>Level</span><select id="level"><option>N5</option><option>N4</option><option>N3</option><option>N2</option><option>N1</option></select></div></header>
<main><section class="videoCard"><div class="video" id="video"><div class="placeholder" id="placeholder"><b>Watch Japanese. Understand more.</b>Paste any Japanese YouTube link to make local subtitles and look up words as you listen.</div></div><div class="videoFooter"><span class="badge">LOCAL SPEECH</span><span id="status">Ready when you are</span></div></section><section class="studyCard"><div class="studyHead"><strong>Watch & read</strong><small id="count">Japanese subtitles</small></div><div class="subtitles" id="subtitles"><div class="hint">Choose a video to begin.</div></div><div class="lookup" id="lookup"><div class="lookupTop"><div><div class="lookupWord" id="lookupWord"></div><div class="reading" id="reading"></div></div><button class="smallButton" id="close">✕</button></div><div class="definitions" id="definitions"></div><button class="smallButton" id="known">Mark known</button></div><div class="controls"><button class="control" id="previous" aria-label="Previous sentence">↶</button><button class="control play" id="play" aria-label="Play or pause">▶</button><button class="control" id="next" aria-label="Next sentence">↷</button></div></section></main>
<script src="https://www.youtube.com/iframe_api"></script><script>
let player=null,videoId='',cues=[],cueIndex=-1,poll=null,clock=null,selectedWord='';
const $=id=>document.getElementById(id),known=new Set(JSON.parse(localStorage.getItem('immersed.mac.known')||'[]'));
function idFrom(input){try{const u=new URL(input.trim());const id=u.hostname==='youtu.be'?u.pathname.slice(1):/^(?:www\.|m\.)?youtube\.com$/.test(u.hostname)?u.searchParams.get('v')||u.pathname.match(/^\/(?:shorts|embed)\/([^/]+)/)?.[1]:null;return /^[\w-]{11}$/.test(id||'')?id:null}catch{return null}}
function setStatus(text,error=false){$('status').innerHTML='';if(text.startsWith('Working:')){const s=document.createElement('span');s.className='spinner';$('status').append(s)}const t=document.createElement('span');t.textContent=text;$('status').append(t);$('status').className=error?'error':''}
function words(text){const segmenter=new Intl.Segmenter('ja',{granularity:'word'});return [...segmenter.segment(text)].map(x=>x.segment)}
function renderCue(){if(!player||!cues.length)return;const t=player.getCurrentTime?.()||0;let i=cues.findIndex(c=>c.start<=t&&t<c.end);if(i===cueIndex)return;cueIndex=i;$('subtitles').replaceChildren();if(i<0){const s=document.createElement('div');s.className='hint';s.textContent='Listening…';$('subtitles').append(s);return}const line=document.createElement('div');line.className='line';for(const piece of words(cues[i].text)){if(!piece.trim()){line.append(document.createTextNode(piece));continue}const button=document.createElement('button');button.className='word'+(known.has(piece)?'':' unknown');button.textContent=piece;button.onclick=()=>lookup(piece);line.append(button)}$('subtitles').append(line)}
async function lookup(word){selectedWord=word;$('lookup').classList.add('show');$('lookupWord').textContent=word;$('reading').textContent='';$('definitions').textContent='Looking up…';$('known').textContent=known.has(word)?'Mark unknown':'Mark known';try{const r=await fetch('/api/immersion/dictionary?word='+encodeURIComponent(word));const data=await r.json();if(selectedWord!==word)return;const entries=data.data||[];$('reading').textContent=entries[0]?.japanese?.map(x=>x.reading).filter(Boolean).join(' · ')||'';$('definitions').textContent=entries.slice(0,3).flatMap(x=>x.senses?.slice(0,2).map(s=>s.english_definitions.join('; '))||[]).join(' · ')||'No dictionary entry found.'}catch{$('definitions').textContent='Dictionary unavailable.'}}
async function loadVideo(id){videoId=id;cues=[];cueIndex=-1;$('subtitles').innerHTML='<div class="hint">Preparing Japanese subtitles…</div>';$('lookup').classList.remove('show');if(player?.destroy)player.destroy();$('video').replaceChildren();const target=document.createElement('div');target.id='player';$('video').append(target);const create=()=>{player=new YT.Player('player',{videoId:id,playerVars:{playsinline:1,cc_load_policy:0,origin:location.origin},events:{onReady:()=>{player.playVideo();clearInterval(clock);clock=setInterval(renderCue,150)}}})};if(window.YT?.Player)create();else window.onYouTubeIframeAPIReady=create;setStatus('Working: preparing audio');await fetch('/api/desktop/transcribe?videoId='+id,{method:'POST'});clearInterval(poll);poll=setInterval(async()=>{try{const r=await fetch('/api/desktop/transcribe?videoId='+id);const s=await r.json();if(id!==videoId)return;if(s.status==='ready'){cues=s.cues||[];$('count').textContent=cues.length+' subtitle lines';setStatus('Japanese subtitles ready · on-device model');clearInterval(poll);renderCue()}else if(s.status==='unavailable'){setStatus(s.message||'Transcription failed',true);$('subtitles').innerHTML='<div class="hint error">Audio could not be transcribed for this video.</div>';clearInterval(poll)}else setStatus('Working: '+(s.stage||'recognizing Japanese speech'))}catch{setStatus('Local service unavailable',true)}},1500)}
$('search').onsubmit=e=>{e.preventDefault();const value=$('query').value.trim(),id=idFrom(value);if(id)loadVideo(id);else if(value)window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(value+' 日本語'),'_blank')};$('close').onclick=()=>$('lookup').classList.remove('show');$('known').onclick=()=>{if(known.has(selectedWord))known.delete(selectedWord);else known.add(selectedWord);localStorage.setItem('immersed.mac.known',JSON.stringify([...known]));$('known').textContent=known.has(selectedWord)?'Mark unknown':'Mark known';cueIndex=-1;renderCue()};$('play').onclick=()=>{if(!player)return;player.getPlayerState()===1?player.pauseVideo():player.playVideo()};function seek(dir){if(!player||!cues.length)return;const t=player.getCurrentTime();const target=dir<0?[...cues].reverse().find(c=>c.start<t-1)?.start:cues.find(c=>c.start>t+.2)?.start;if(target!==undefined){player.seekTo(target,true);cueIndex=-1;renderCue()}}$('previous').onclick=()=>seek(-1);$('next').onclick=()=>seek(1);document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft')seek(-1);if(e.key==='ArrowRight')seek(1);if(e.key==='Escape')$('lookup').classList.remove('show')});
</script></html>
