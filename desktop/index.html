<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>immersed.</title>
    <link rel="stylesheet" href="/study.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="/icon.png" alt="" /><strong>immersed.</strong>
      </div>
      <form id="search">
        <input
          id="query"
          placeholder="Search YouTube or paste a video link"
          aria-label="Search YouTube or paste a video link"
        /><button class="primary">Search</button>
      </form>
      <nav aria-label="Navigation">
        <button
          id="fullscreen"
          aria-label="Toggle fullscreen"
          title="Fullscreen · F"
        >
          ⛶</button
        ><button id="openFile">Open file</button
        ><button id="libraryButton">Library</button
        ><button id="wordsButton">Words</button
        ><button id="settingsButton">Settings</button>
      </nav>
    </header>
    <main>
      <section class="videoCard">
        <div class="video" id="video">
          <div class="placeholder">
            <b>Your Japanese, in context.</b>Open a Japanese video or audiobook.
            Import MP4, M4B, M4A, MP3 and other local media to study offline.
          </div>
        </div>
        <div class="videoFooter">
          <span class="badge" id="sourceBadge">LOCAL STUDY</span
          ><span id="status" role="status">Ready when you are</span
          ><button id="download" hidden>Download for offline</button>
        </div>
        <div id="chapters" hidden>
          <label
            >Chapter
            <select id="chapterSelect"></select
          ></label>
        </div>
      </section>
      <section class="studyCard">
        <div class="studyHead">
          <strong>Watch & read</strong>
          <div>
            <small id="count">Japanese subtitles</small><br /><small
              id="coverage"
            ></small>
          </div>
        </div>
        <div class="subtitles" id="subtitles">
          <div class="hint">Choose a video or audiobook to begin.</div>
        </div>
        <div class="lookup" id="lookup">
          <div class="lookupTop">
            <div>
              <div class="lookupWord" id="lookupWord"></div>
              <div class="reading" id="reading"></div>
            </div>
            <button id="closeLookup" aria-label="Close lookup">✕</button>
          </div>
          <div id="grammar" class="hint"></div>
          <div class="definitions" id="definitions"></div>
          <div id="alternatives" class="hint"></div>
          <button id="known">Mark known</button
          ><button id="saveWord">Save word</button
          ><button id="speak">Pronounce</button>
        </div>
        <div class="controls">
          <button class="control" id="previous" aria-label="Previous sentence">
            ↶</button
          ><button class="control play" id="play" aria-label="Play or pause">
            ▶</button
          ><button class="control" id="next" aria-label="Next sentence">
            ↷</button
          ><label class="hint"
            >Speed
            <select id="speed">
              <option>0.75</option>
              <option selected>1</option>
              <option>1.25</option>
              <option>1.5</option>
              <option>2</option>
            </select></label
          >
        </div>
      </section>
    </main>
    <dialog id="panel">
      <div class="panelHead">
        <h2 id="panelTitle"></h2>
        <button id="closePanel" aria-label="Close panel">✕</button>
      </div>
      <div id="panelBody"></div>
    </dialog>
    <input
      id="fileInput"
      type="file"
      accept=".mp4,.m4v,.mov,.m4b,.m4a,.mp3,.wav,.aac,.flac,.ogg,.webm"
      hidden
    />
    <input
      id="settingsInput"
      type="file"
      accept="application/json,.json"
      hidden
    />
    <script src="/shared/preferences-core.js"></script>
    <script src="/shared/learning-core.js"></script>
    <script src="/compare.js"></script>
    <script src="/study.js"></script>
  </body>
</html>
